name: Legacy blog-list export (manual only)

# This fork is a separate RSS aggregator. The upstream job fetches indi.blog
# and rewrites README / feed.opml. Do not run it on pushes or on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint original blog list
        run: node scripts/lint.mjs
      - name: Render upstream README snapshot
        run: node scripts/render-readme.mjs
      - name: Generate upstream OPML
        run: node scripts/generate-opml.mjs
      - name: Export files without pushing commits
        uses: actions/upload-artifact@v4
        with:
          name: upstream-blog-list
          path: |
            README.md
            feed.opml
