name: DiggSpace checks

on:
  pull_request:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm no upstream runtime dependencies
        run: node scripts/test_independence.mjs
      - name: Check all D1 migrations
        run: python3 scripts/test_feedspace_schema.py
      - name: Check Worker and deployment script syntax
        run: |
          node --check frontend/worker/index.js
          node --check frontend/worker/crawl.js
          node --check frontend/worker/views.js
          node --check frontend/worker/views-aihot.js
          node --check frontend/worker/aihot.js
          node --check frontend/worker/feedspace-admin.js
          node --check frontend/worker/admin-panel.js
          node --check frontend/public/admin.js
          node --check frontend/scripts/check-deployment.mjs
          node --check frontend/scripts/test-cloudflare-preview.mjs
      - name: Ensure placeholder D1 blocks accidental deployment
        run: |
          if node frontend/scripts/check-deployment.mjs; then
            echo "Unsafe: unconfigured deployment was permitted!"
            exit 1
          fi
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Check category filters and existing layout
        run: node frontend/scripts/test-feedspace.mjs
      - name: Test protected RSS management endpoints and retired-source exclusion
        run: node frontend/scripts/test-feedspace-admin.mjs
      - name: Test AIHOT v1 adapters, publication schedule and no-license gate
        run: node frontend/scripts/test-aihot.mjs
      - name: Smoke-test local Wrangler Worker with real D1 SQL
        run: |
          printf 'ADMIN_TOKEN=ci-local-admin-token-0123456789abcdef0123456789\nCACHE_TTL=0\nEMAIL_DEV_LOG=1\nGITHUB_CLIENT_ID=\n' > frontend/.dev.vars
          npm run db:migrate --prefix frontend
          npm run dev:seed --prefix frontend
          node frontend/scripts/test-worker-runtime.mjs
      - name: Test safe Cloudflare deployment preparation
        run: |
          node frontend/scripts/test-cloudflare-deploy.mjs
          node frontend/scripts/test-deploy-retry.mjs
      - name: Ensure default AIHOT exposure is disabled
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const source = readFileSync("frontend/wrangler.jsonc", "utf8");
            if (!source.includes(`"AIHOT_PUBLIC_DISPLAY_ALLOWED": "false"`)) process.exit(1);
          '
      - name: Bundle workers.dev preview without account credentials
        working-directory: frontend
        env:
          DIGGSPACE_D1_ID: 11111111-2222-3333-4444-555555555555
        run: |
          node scripts/prepare-cloudflare-deployment.mjs
          node scripts/check-deployment.mjs
          npx wrangler deploy --dry-run
