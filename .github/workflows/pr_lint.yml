name: DiggSpace checks

on:
  pull_request:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Check isolated read-only architecture
        run: node scripts/test_independence.mjs
      - name: Validate all 15 D1 migrations
        run: python3 scripts/test_feedspace_schema.py
      - name: JavaScript syntax
        run: |
          node --check scripts/lib/feed.mjs
          node --check frontend/worker/index.js
          node --check frontend/worker/catalog.js
          node --check frontend/worker/news.js
          node --check frontend/scripts/prepare-cloudflare-deployment.mjs
          node --check frontend/scripts/test-worker-runtime.mjs
          node --check frontend/scripts/test-cloudflare-preview.mjs
      - name: Verify placeholder D1 remains undeployable
        run: |
          if node frontend/scripts/check-deployment.mjs; then
            echo "Unsafe placeholder D1 was deployable"
            exit 1
          fi
      - name: Install Worker dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Audit production npm dependencies for high-severity advisories
        run: npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Inspect latest dependency integrity and development dependency advisories
        run: |
          npm view hono@4.13.19 dist.tarball dist.integrity --json
          npm audit --prefix frontend --audit-level=high || true
      - name: Test curated feed integrity
        run: node frontend/scripts/test-news.mjs
      - name: Apply real local D1 migrations and seed two article fixtures
        working-directory: frontend
        run: |
          npx wrangler d1 migrations apply diggspace --local
          npx wrangler d1 execute diggspace --local --file=./scripts/seed-dev.sql
      - name: Smoke-test actual local Worker/D1 and removed endpoints
        run: node frontend/scripts/test-worker-runtime.mjs
      - name: Test safe Cloudflare deployment preparation
        run: |
          node frontend/scripts/test-cloudflare-deploy.mjs
          node frontend/scripts/test-deploy-retry.mjs
      - name: Bundle Worker dry-run without credentials
        working-directory: frontend
        env:
          DIGGSPACE_D1_ID: 11111111-2222-3333-4444-555555555555
        run: |
          node scripts/prepare-cloudflare-deployment.mjs
          node scripts/check-deployment.mjs
          npx wrangler deploy --dry-run
