name: Deploy DiggSpace to digg.space (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BIND_DIGG_SPACE to publish https://digg.space'
        required: true
        type: string
  # Temporary owner-only release of the reviewed master; remove after verification.
  pull_request:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: diggspace-cloudflare-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' &&
        inputs.confirm == 'BIND_DIGG_SPACE') ||
        (github.event_name == 'pull_request' &&
         github.repository == 'tenglei87/diggspace' &&
         github.event.pull_request.user.login == 'tenglei87' &&
         github.event.pull_request.head.repo.full_name == 'tenglei87/diggspace' &&
         github.event.pull_request.base.ref == 'master' &&
         github.event.pull_request.title == 'DiggSpace slim sidebar release 2026-11-20') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) {
              throw Error("Missing Cloudflare token or account ID");
            }
          '
      - name: Resolve own D1 database
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/resolve-cloudflare-d1.mjs
      - name: Prepare independent domain and hourly RSS cron
        working-directory: frontend
        run: |
          node scripts/prepare-cloudflare-deployment.mjs
          node scripts/check-deployment.mjs
      - name: Migrate D1 without deleting old user data
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply diggspace --remote
      - name: Publish read-only RSS news Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-with-retry.mjs
      - name: Verify public routes, categories and removed admin features
        working-directory: frontend
        env:
          DIGGSPACE_URL: https://digg.space
        run: node scripts/test-cloudflare-preview.mjs
      - name: Deployment summary
        run: |
          echo "## DiggSpace RSS newspaper deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Domain: https://digg.space" >> "$GITHUB_STEP_SUMMARY"
          echo "78 sources in code; hourly RSS cron is enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Login, discussions, following and administrator pages are removed" >> "$GITHUB_STEP_SUMMARY"
          echo "The first hourly crawl will populate new articles; feeds may fail independently" >> "$GITHUB_STEP_SUMMARY"
