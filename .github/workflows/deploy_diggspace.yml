name: Deploy DiggSpace preview (manual)

# Explicitly opt-in deployment. No pushes or PRs deploy to Cloudflare.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_DIGGSPACE to deploy to your workers.dev account'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diggspace-cloudflare-deployment
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.ref == 'refs/heads/master' && inputs.confirm == 'DEPLOY_DIGGSPACE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Validate Cloudflare credentials before changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGGSPACE_ADMIN_TOKEN: ${{ secrets.DIGGSPACE_ADMIN_TOKEN }}
        run: |
          node -e '
            const {CLOUDFLARE_API_TOKEN:a,CLOUDFLARE_ACCOUNT_ID:b,DIGGSPACE_ADMIN_TOKEN:c}=process.env;
            if (!a || !b || !c || c.length < 32) {
              console.error("Missing GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, or 32+ character DIGGSPACE_ADMIN_TOKEN");
              process.exit(1);
            }
          '
      - name: Find or create independent diggspace D1
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/resolve-cloudflare-d1.mjs
      - name: Generate preview config (no cron, no email binding)
        working-directory: frontend
        run: |
          node scripts/prepare-cloudflare-deployment.mjs
          node scripts/check-deployment.mjs
      - name: Apply D1 schema migrations
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply diggspace --remote
      - name: Deploy to workers.dev
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/diggspace-deploy.jsonl
        run: |
          npx wrangler deploy
          node scripts/read-deployment-output.mjs
      - name: Set independent administrator bearer secret
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGGSPACE_ADMIN_TOKEN: ${{ secrets.DIGGSPACE_ADMIN_TOKEN }}
        run: printf '%s' "$DIGGSPACE_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
      - name: Verify public pages and protected admin API
        working-directory: frontend
        env:
          DIGGSPACE_ADMIN_TOKEN: ${{ secrets.DIGGSPACE_ADMIN_TOKEN }}
        run: node scripts/test-cloudflare-preview.mjs
      - name: Deployment summary
        run: |
          echo "## DiggSpace preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $DIGGSPACE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "D1: diggspace (own Cloudflare account)" >> "$GITHUB_STEP_SUMMARY"
          echo "Automatic crawling and email login: intentionally disabled in preview" >> "$GITHUB_STEP_SUMMARY"
