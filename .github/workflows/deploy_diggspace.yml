name: Deploy DiggSpace to digg.space (manual)

# Explicitly opt-in deployment. No pushes or PRs deploy to Cloudflare.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BIND_DIGG_SPACE to publish on https://digg.space'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diggspace-cloudflare-deployment
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.ref == 'refs/heads/master' && inputs.confirm == 'BIND_DIGG_SPACE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Validate Cloudflare credentials before changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGGSPACE_ADMIN_TOKEN: ${{ secrets.DIGGSPACE_ADMIN_TOKEN }}
        run: |
          node -e '
            const {CLOUDFLARE_API_TOKEN:a,CLOUDFLARE_ACCOUNT_ID:b,DIGGSPACE_ADMIN_TOKEN:c}=process.env;
            if (!a || !b || !c || c.length < 32) {
              console.error("Missing GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, or 32+ character DIGGSPACE_ADMIN_TOKEN");
              process.exit(1);
            }
          '
      - name: Find or create independent diggspace D1
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/resolve-cloudflare-d1.mjs
      - name: Prepare digg.space custom domain (no cron, no email binding)
        working-directory: frontend
        run: |
          node scripts/prepare-cloudflare-deployment.mjs
          node scripts/check-deployment.mjs
      - name: Apply D1 schema migrations
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply diggspace --remote
      - name: Publish Worker on the digg.space custom domain
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-with-retry.mjs
      - name: Set independent administrator bearer secret
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGGSPACE_ADMIN_TOKEN: ${{ secrets.DIGGSPACE_ADMIN_TOKEN }}
        run: printf '%s' "$DIGGSPACE_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
      - name: Rebuild source snapshot after retiring the old Indi catalog
        env:
          DIGGSPACE_ADMIN_TOKEN: ${{ secrets.DIGGSPACE_ADMIN_TOKEN }}
        run: |
          node --input-type=module -e '
            const r = await fetch("https://digg.space/api/admin/snapshot", {
              method: "POST", headers: { Authorization: "Bearer " + process.env.DIGGSPACE_ADMIN_TOKEN },
              signal: AbortSignal.timeout(30000)
            });
            if (!r.ok) throw Error("Failed to rebuild public snapshot: " + r.status);
            const summary = await r.json();
            console.log("Refreshed active RSS source snapshot:", summary.blogs);
            if (!Number.isInteger(summary.blogs) || summary.blogs < 0)
              throw Error("Invalid active RSS source count");
            // The original 1609 sources were retired. Preserve independent
            // feeds subsequently added through the administrator dashboard.
          '
      - name: Verify digg.space pages and protected admin API
        working-directory: frontend
        env:
          DIGGSPACE_URL: https://digg.space
          DIGGSPACE_ADMIN_TOKEN: ${{ secrets.DIGGSPACE_ADMIN_TOKEN }}
        run: node scripts/test-cloudflare-preview.mjs
      - name: Deployment summary
        run: |
          echo "## DiggSpace custom domain deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://digg.space" >> "$GITHUB_STEP_SUMMARY"
          echo "D1: diggspace (own Cloudflare account)" >> "$GITHUB_STEP_SUMMARY"
          echo "Automatic crawling and email login: intentionally disabled until verified" >> "$GITHUB_STEP_SUMMARY"
